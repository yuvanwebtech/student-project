<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Portfolio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#111827;
      color:white;
    }

    .container{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    h1{
      font-size:50px;
      margin-bottom:10px;
      color:#38bdf8;
    }

    p{
      font-size:20px;
      margin-bottom:20px;
    }

    button{
      padding:12px 25px;
      border:none;
      background:#38bdf8;
      color:black;
      font-size:18px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:white;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome Students 🚀</h1>
    <p>This is my first GitHub deployed project.</p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </div>

  <script>
    function showMessage(){
      alert("Project Successfully Working 🔥");
    }
  </script>

</body>
</html>
